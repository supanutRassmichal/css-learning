<!DOCTYPE html>
<html>
    <head>
        <title>Learn Pseudo Element</title>

        <style>
            p::after {
                content: ".";
            }
        </style>
    </head>
    <body>
        <p>Hello, World!</p>
        <p>My name is Nut</p>
        <p>I am learning CSS pseudo-elements</p>
        <p>I want to be a software developer</p>
    </body>
</html>
