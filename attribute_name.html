<!DOCTYPE html>
<html>
    <head>
        <title>Learn Attribute Selector</title>
        <style>
            a[target="_top"] {
                color: orange;
            }
        </style>
    </head>
    <body>
        <a href="https://www.google.com" target="_blank">Google</a>
        <a href="https://www.apple.com" target="_top">Apple</a>
    </body>
</html>
