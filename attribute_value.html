<!DOCTYPE html>
<html>
    <head>
        <title>Learn Attribute Selector</title>
        <style>
            p[class*="g"] {
                color: orange;
            }
        </style>
    </head>
    <body>
        <p class="top-left">Top left</p>
        <p class="top-right">Top right</p>
        <p class="top-center">Top center</p>
    </body>
</html>
