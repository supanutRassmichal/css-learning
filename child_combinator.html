<!DOCTYPE html>
<html>
    <head>
        <title>Learn Combination Selector</title>
        <style>
            div > p {
                color: red;
            }
        </style>

    </head>
    <body>
        <h1>Hello world</h1>
        <div>
            <h2>My name is Nut</h2>
            <p>I am a Developer!</p>
            <section>
                <p>I am Learning css</p>
            </section>
            <p>I am a student</p>
        </div>
    </body>
</html>
