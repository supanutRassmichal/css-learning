<!DOCTYPE html>
<html>
    <head>
        <title>Learn Pseudo Classes</title>
        <style>
           div h2:nth-of-type(3) {
            background-color: purple;
           }
            /* div h2:nth-child(even) {
            background-color: pink;
           } */
        </style>
    </head>
    <body>
        <h1>Fruity</h1>
        <div>
            <h1>1. mango</h1>
            <h2>2. kiwi</h2>
            <h3>3. banana</h3>
            <h4>4. lemon</h4>
            <h2>5. orange</h2>
            <h2>5. orange</h2>
        </div>
    </body>
</html>
