<!DOCTYPE html>
<html>
    <head>
        <title>Learn CSS</title>
        <style>
            input:disabled {
                            background-color: gray;
            }
            input:enabled {
                            background-color: navy;
            }
        </style>
    </head>
    <body>
        <div>
            <label>first name:</label>
            <input id="first_name" name="first_name"/>
        </div>
        <div>
            <label>Last name:</label>
            <input id="last_name" name="last_name" disabled/>
        </div>
    </body>
</html>
