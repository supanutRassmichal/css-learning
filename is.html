<!DOCTYPE html>
<html>
    <head>
        <title>Learn Pseudo Classes</title>
        <style>
           :is(h1,h2) {
                        color: green;
           }

           :is(h3,h4) {
                        background-color: pink;
           }
        </style>
    </head>
    <body>
        <h1>Fruity</h1>
        <div>
            <h1>1. mango</h1>
            <h2>2. kiwi</h2>
            <h3>3. banana</h3>
            <h4>4. lemon</h4>
            <h2>5. orange</h2>
            <h2>5. orange</h2>
        </div>
    </body>
</html>
