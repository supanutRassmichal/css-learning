<!DOCTYPE html>
<html>
    <head>
        <title>Learn Pseudo Element</title>

        <style>
            ul li::marker {
                color: orange;
                content: "- ";
            }
        </style>
    </head>
    <body>
        <ul>
            <li>Coffee</li>
            <li>Milk</li>
            <li>Tea</li>
        </ul>
        <ol>
            <li>Coffee</li>
            <li>Milk</li>
            <li>Tea</li>
        </ol>
    </body>
</html>
