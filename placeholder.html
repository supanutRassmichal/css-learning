<!DOCTYPE html>
<html>
    <head>
        <title>Learn Pseudo Element</title>

        <style>
           input::placeholder {
                color: pink;
            }
        </style>
    </head>
    <body>
        <label>First Name:</label>
        <input type="text" id="first_name" name="first_name" placeholder="input your first name"> 
    </body>
</html>
