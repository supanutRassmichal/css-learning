<!DOCTYPE html>
<html>
    <head>
        <title>Learn Pseudo Classes</title>
        <style>
           h1:target {
            background-color: orange;
           }
        </style>
    </head>
    <body>
        <a href="#link1">LINK1</a>
        <a href="#link2">LINK2</a>
        <h1 id="link1">SHOW FROM LINK1</h1>
        <h1 id="link2">SHOW FROM LINK2</h1>
    </body>

</html>
